openapi: 3.0.3
info:
  title: Rain-Ready API
  version: 0.2.0
  description: |
    FROZEN CONTRACT (owner: dev#1). Frontends (dev#2/3/4) builds against these shapes; backends implement them.
    Change a shape only by editing this file in a PR and telling the group. `make status` checks the live server against it.
    Auth: browsers send `X-User-Id` (a UUID in localStorage, no accounts). Operator calls also send `X-Ops-Key`.
    All user-facing safety text comes from core/safety_copy.py. No LLM text in safety content.
servers: [{url: /}]
paths:
  /api/health:
    get: {tags: [shared], summary: Liveness + loaded routers, responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}}}
  /api/state:
    get: {tags: [shared], summary: "Storm mode + ledger head. Owner dev#1", responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/State'}}}}}}
  /api/map:
    get: {tags: [shared], summary: "Assets with score+tier, hotspots, recent reports. Owner dev#3", responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MapData'}}}}}}
  /api/board:
    get: {tags: [shared], summary: "Ward-level aggregate. Owner dev#1. No names, no tonnage", responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Board'}}}}}}
  /api/reports:
    post:
      tags: [reports]
      summary: "Create a report (camera photo + location). Owner dev#1"
      description: "multipart/form-data. If category is live_wire or open_manhole the response MUST include hazard_text (pre-written, from core/safety_copy.hazard_text)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, lat, lon]
              properties:
                category: {type: string, enum: [blocked_drain, waterlogged_road, open_manhole, live_wire, basement_water, other]}
                lat: {type: number}
                lon: {type: number}
                accuracy_m: {type: number}
                location_verified: {type: boolean, description: "false when the user placed the pin manually"}
                client_ts: {type: string}
                note: {type: string}
                lang: {type: string, enum: [en, hi]}
                photo: {type: string, format: binary}
      responses:
        '200': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/ReportCreated'}}}}
        '422': {description: "validation error (e.g. outside NCR)"}
    get:
      tags: [reports]
      summary: "Recent reports (public, coarse). Owner dev#1"
      responses: {'200': {description: ok, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ReportPublic'}}}}}}
  /api/jobs:
    get:
      tags: [jobs]
      summary: "Jobs with level/status. Owner dev#1"
      responses: {'200': {description: ok, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Job'}}}}}}
    post:
      tags: [jobs]
      summary: "Create a job for an asset (ops key). Owner dev#1"
      security: [{opsKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [asset_id], properties: {asset_id: {type: string}, trigger: {type: string, enum: [p1_storm, p2_inspection, report, manual]}, note: {type: string}}}}}}
      responses: {'200': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}}
  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: "Job detail with evidence list and flags. Owner dev#1"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/JobDetail'}}}}, '404': {description: not found}}
  /api/jobs/{id}/evidence:
    post:
      tags: [jobs]
      summary: "Add evidence. Level recomputed with core.levels.compute_level. Owner dev#1"
      description: "before|after|bank must come from role=crew; confirm from role=resident with a DIFFERENT X-User-Id than any crew evidence. A job reaching level>=2 sets assets.last_confirmed_clean. Every evidence write also appends to the ledger via app/ledger.append."
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [phase, role, lat, lon, photo]
              properties:
                phase: {type: string, enum: [before, after, bank, confirm, audit]}
                role: {type: string, enum: [crew, resident, staff]}
                lat: {type: number}
                lon: {type: number}
                accuracy_m: {type: number}
                client_ts: {type: string}
                photo: {type: string, format: binary}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceResult'}}}}}
  /api/buildings:
    post:
      tags: [buildings]
      summary: "Save a building; level computed from the caretaker's own answers. Owner dev#3"
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuildingIn'}}}}
      responses: {'200': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/BuildingOut'}}}}}
  /api/buildings/{code}:
    get:
      tags: [buildings]
      summary: "Caretaker view with the checklist for the current storm state. Owner dev#3"
      parameters: [{name: code, in: path, required: true, schema: {type: string}}, {name: lang, in: query, schema: {type: string, enum: [en, hi]}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/BuildingOut'}}}}, '404': {description: not found}}
  /api/buildings/{code}/ack:
    post:
      tags: [buildings]
      summary: "Caretaker acknowledges the current warning. Writes ledger. Owner dev#3"
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {acknowledged_at: {type: string}, ledger_id: {type: integer}}}}}}}
  /api/public/b/{code}:
    get:
      tags: [buildings]
      summary: "PUBLIC placard data for the QR page. Self-declared, information only, never a rating. Owner dev#3"
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Placard'}}}}, '404': {description: not found}}
  /api/ops/storm:
    post:
      tags: [ops]
      summary: "Drill switch / enter an official warning (ops key). Writes ledger. Owner dev#1"
      security: [{opsKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}, level: {type: string, enum: [watch, warning]}, source: {type: string}, notify: {type: boolean, description: "if true and Telegram is configured, send the pre-written storm checklist to TEAM chats (see /api/alerts/telegram)"}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Storm'}}}}, '401': {description: bad key}}
  /api/ledger/head:
    get: {tags: [ledger], summary: "Chain head. Owner dev#1", responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerHead'}}}}}}
  /api/ledger/verify/{id}:
    get:
      tags: [ledger]
      summary: "Recompute the chain and show the entry. Owner dev#1"
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerVerify'}}}}, '404': {description: not found}}
  /api/lowpoints:
    get:
      tags: [lowpoints]
      summary: "Hand-placed illustrative low points with their parameters and current silt estimate. Owner dev#3"
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/LowpointsList'}}}}}
  /api/lowpoints/simulate:
    post:
      tags: [lowpoints]
      summary: "SCENARIO simulator: fill order and time-to-fill for a rain intensity. Not a forecast. Owner dev#3 (logic: core/lowpoints.py)"
      description: "drain_state clean = no silt; silted = 25% of design depth is silt; current = silt estimated from each pocket's linked assets (so a confirmed cleaning (L2) slows the fill). at_h is the time at which fill_pct_at is reported, for animation."
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [rain_mm_h], properties: {rain_mm_h: {type: number, minimum: 0, maximum: 250}, drain_state: {type: string, enum: [clean, silted, current]}, at_h: {type: number, minimum: 0, maximum: 24}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/SimResult'}}}}, '422': {description: invalid}}
  /api/replay:
    get:
      tags: [lowpoints]
      summary: "Forecast-miss timeline for 27 Jul 2024 with real model numbers and a labelled hindsight reconstruction. Owner dev#4"
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Replay'}}}}}
  /api/capture/presets:
    get:
      tags: [capture]
      summary: "Hypothetical demo plots (water-table values are assumptions). Owner dev#4"
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/CapturePresets'}}}}}
  /api/capture/plan:
    post:
      tags: [capture]
      summary: "EXPERIMENTAL rain-capture decision with the rule that decided it. Owner dev#4 (logic: core/m4_rules.py)"
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CapturePlanIn'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/CapturePlan'}}}}, '422': {description: invalid}}
  /api/alerts/telegram:
    post:
      tags: [alerts]
      summary: "Send a PRE-WRITTEN alert to TEAM Telegram chats only (ops key). Owner dev#1"
      description: "kind lowpoint_high uses core/safety_copy text for the language; storm_checklist sends the building checklist text. Never free text, never an LLM. If TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS are unset, returns sent=0 with a reason (the demo then shows the card only). Writes alerts row + ledger."
      security: [{opsKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [lowpoint_high, storm_checklist]}, lang: {type: string, enum: [en, hi]}, lowpoint_id: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/AlertResult'}}}}, '401': {description: bad key}}
  /media/{key}:
    get:
      tags: [reports]
      summary: "Photo bytes (local storage) or 302 to a pre-signed S3 URL. Owner dev#1"
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: image}, '302': {description: redirect to pre-signed URL}}
components:
  securitySchemes:
    opsKey: {type: apiKey, in: header, name: X-Ops-Key}
  schemas:
    Health: {type: object, properties: {ok: {type: boolean}, version: {type: string}, routers: {type: array, items: {type: string}}, router_errors: {type: object}}}
    Storm:
      type: object
      properties: {active: {type: boolean}, level: {type: string, enum: [none, watch, warning]}, source: {type: string}, set_at: {type: string, nullable: true}}
      example: {active: true, level: warning, source: "IMD orange (entered by operator)", set_at: "2026-10-10T09:00:00+00:00"}
    LedgerHead: {type: object, properties: {count: {type: integer}, head_hash: {type: string}, head_id: {type: integer, nullable: true}, as_of: {type: string, nullable: true}}}
    State:
      type: object
      properties: {storm: {$ref: '#/components/schemas/Storm'}, server_time: {type: string}, version: {type: string}, ledger: {$ref: '#/components/schemas/LedgerHead'}, triage_mode: {type: string, enum: [manual, bedrock]}, storage: {type: string, enum: [local, s3]}}
    MapAsset:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [drain_segment, inlet, underpass, pump_station]}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        owner: {type: string}
        covered: {type: boolean}
        v: {type: number, description: "0..1 vulnerability"}
        basis: {type: string, enum: [measured, estimated]}
        components: {type: object, additionalProperties: {type: number}}
        tier: {type: string, enum: [P1, P2, WATCH, NONE]}
        last_confirmed_clean: {type: string, nullable: true}
        data_source: {type: string}
        confidence: {type: string}
        job: {type: object, nullable: true, properties: {id: {type: integer}, level: {type: integer}, status: {type: string}}}
    Hotspot: {type: object, properties: {id: {type: string}, name: {type: string}, kind: {type: string}, lat: {type: number}, lon: {type: number}, data_source: {type: string}, year: {type: integer, nullable: true}, note: {type: string, nullable: true}}}
    MapData:
      type: object
      properties:
        storm: {$ref: '#/components/schemas/Storm'}
        assets: {type: array, items: {$ref: '#/components/schemas/MapAsset'}}
        hotspots: {type: array, items: {$ref: '#/components/schemas/Hotspot'}}
        reports: {type: array, items: {$ref: '#/components/schemas/ReportPublic'}}
        disclaimer: {type: string}
    Board: {type: object, properties: {assets_total: {type: integer}, assets_independently_confirmed: {type: integer}, pct_confirmed: {type: number}, jobs_by_status: {type: object, additionalProperties: {type: integer}}, note: {type: string}}}
    ReportPublic: {type: object, properties: {id: {type: integer}, ticket: {type: string}, category: {type: string}, lat: {type: number}, lon: {type: number}, status: {type: string, enum: [reported, unverified, corroborated]}, created_at: {type: string}}}
    Triage:
      type: object
      description: "Bedrock output or {mode: manual}. Display and routing only. NEVER a scoring input."
      properties: {mode: {type: string}, type: {type: string}, severity: {type: string, enum: [low, medium, high, danger]}, silt_fill_fraction: {type: number, nullable: true}, gauge_rod_visible: {type: boolean}, hazards: {type: array, items: {type: string}}, one_line_summary: {type: string}, needs_human_review: {type: boolean}}
    ReportCreated:
      type: object
      properties:
        id: {type: integer}
        ticket: {type: string}
        status: {type: string}
        asset_id: {type: string, nullable: true}
        triage: {$ref: '#/components/schemas/Triage'}
        hazard_text: {type: string, nullable: true, description: "pre-written; present for live_wire/open_manhole"}
        forward_text: {type: string, description: "pre-filled message the user can send to 1908 / 311"}
        footer: {type: string}
    Job: {type: object, properties: {id: {type: integer}, asset_id: {type: string}, asset_name: {type: string}, created_at: {type: string}, trigger: {type: string}, level: {type: integer, minimum: 0, maximum: 3}, status: {type: string, enum: [CLAIMED, FLAGGED, EVIDENCE_SUBMITTED, CONFIRMED, AUDITED]}}}
    EvidenceItem: {type: object, properties: {id: {type: integer}, phase: {type: string}, role: {type: string}, lat: {type: number}, lon: {type: number}, accuracy_m: {type: number, nullable: true}, server_ts: {type: string}, photo_url: {type: string}, flags: {type: array, items: {type: string}}, ledger_id: {type: integer, nullable: true}}}
    JobDetail:
      allOf:
        - {$ref: '#/components/schemas/Job'}
        - type: object
          properties: {evidence: {type: array, items: {$ref: '#/components/schemas/EvidenceItem'}}, notes: {type: array, items: {type: string}}}
    EvidenceResult: {type: object, properties: {evidence_id: {type: integer}, flags: {type: array, items: {type: string}}, level: {type: integer}, status: {type: string}, notes: {type: array, items: {type: string}}, ledger_id: {type: integer}}}
    BuildingIn:
      type: object
      required: [name, basement, entrance_below_road, people_inside, ramp_over_drain, consent]
      properties:
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        declared_use: {type: string}
        declared_exits: {type: integer}
        basement: {type: boolean}
        entrance_below_road: {type: boolean}
        people_inside: {type: boolean}
        ramp_over_drain: {type: boolean}
        lang: {type: string, enum: [en, hi]}
        consent: {type: boolean}
    BuildingOut:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [HIGH_ATTENTION, ELEVATED, NO_SPECIFIC_FLAG]}
        reasons: {type: array, items: {type: string}}
        message: {type: object, description: "core.safety_copy.building_message output: headline, items[], always, footer, storm_active, lang"}
        placard_url: {type: string}
    Placard:
      type: object
      properties:
        name: {type: string}
        declared_use: {type: string, nullable: true}
        declared_exits: {type: integer, nullable: true}
        last_ack_at: {type: string, nullable: true}
        nearest_asset: {type: object, nullable: true, properties: {name: {type: string}, status: {type: string}, last_confirmed_clean: {type: string, nullable: true}, distance_m: {type: number}}}
        storm: {$ref: '#/components/schemas/Storm'}
        info_only: {type: string, description: "core.safety_copy.INFO_ONLY. Must be shown. No green tick, no rating, no 'safe'."}
        is_demo: {type: boolean}
    LedgerVerify: {type: object, properties: {id: {type: integer}, chain_ok: {type: boolean}, first_bad_index: {type: integer, nullable: true}, entry: {type: object}, head: {$ref: '#/components/schemas/LedgerHead'}, proves: {type: string}, does_not_prove: {type: string}}}
    Lowpoint:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [underpass, saucer, low_lane, other]}
        lat: {type: number}
        lon: {type: number}
        spills_to: {type: string, nullable: true}
        catchment_ha: {type: number}
        storage_m3: {type: number}
        runoff_c: {type: number}
        drain_mm_h: {type: number}
        silt_fraction_used: {type: number}
        silt_basis: {type: string, description: "estimated | measured | none | clean | silted"}
        linked_asset_ids: {type: array, items: {type: string}}
        data_source: {type: string}
        confidence: {type: string}
        note: {type: string, nullable: true}
    LowpointsList: {type: object, properties: {lowpoints: {type: array, items: {$ref: '#/components/schemas/Lowpoint'}}, banner: {type: string}}}
    SimResultItem:
      allOf:
        - {$ref: '#/components/schemas/Lowpoint'}
        - type: object
          properties:
            time_to_fill_h: {type: number, nullable: true, description: "null = no net inflow in this scenario"}
            level: {type: string, enum: [none, watch, elevated, high], description: "watch >3 h, elevated 1-3 h, high <= 1 h"}
            fill_pct_at: {type: number}
            fill_order: {type: integer, nullable: true}
            own_inflow_m3_h: {type: number}
            effective_drain_mm_h: {type: number}
    SimResult:
      type: object
      properties:
        scenario: {type: object}
        results: {type: array, items: {$ref: '#/components/schemas/SimResultItem'}, description: "sorted by fill order; never-filling pockets last"}
        alert: {type: object, properties: {active: {type: boolean}, high_ids: {type: array, items: {type: string}}, level: {type: string, enum: [none, elevated, high]}}}
        banner: {type: string, description: "Scenario, not a forecast. Must be shown."}
    ReplayEvent: {type: object, properties: {id: {type: string}, label: {type: string}, date: {type: string}, forecast_day_before_mm_day: {type: number}, model_archive_mm_day: {type: number}, reported_mm: {type: number}, reported_basis: {type: string}, verify: {type: boolean}, reported_outcome: {type: string, nullable: true}}}
    Replay:
      type: object
      properties:
        model: {type: string}
        events: {type: array, items: {$ref: '#/components/schemas/ReplayEvent'}}
        caveats: {type: array, items: {type: string}}
        timeline: {type: array, items: {type: object, properties: {step: {type: integer}, label: {type: string}, text: {type: string}}}}
        hindsight: {type: object, nullable: true, properties: {asset_id: {type: string}, asset_name: {type: string}, v: {type: number}, tier_if_warning_entered: {type: string}, state: {type: string}}}
        footer: {type: string}
    CapturePreset: {type: object, properties: {id: {type: string}, label: {type: string}, roof_m2: {type: number}, water_table_m: {type: number}, soil: {type: string}, in_floodplain: {type: boolean}, has_vehicular_or_wash_runoff: {type: boolean}, nearest_septic_or_sewer_m: {type: number}, water_table_verified: {type: boolean}, area_hint: {type: string}}}
    CapturePresets: {type: object, properties: {presets: {type: array, items: {$ref: '#/components/schemas/CapturePreset'}}, banner: {type: string}}}
    CapturePlanIn:
      type: object
      required: [roof_m2]
      properties:
        roof_m2: {type: number, exclusiveMinimum: 0}
        water_table_m: {type: number, nullable: true}
        in_floodplain: {type: boolean}
        soil: {type: string, enum: [sandy_loam, loam, clay_loam], nullable: true}
        infiltration_mm_h: {type: number, nullable: true}
        has_vehicular_or_wash_runoff: {type: boolean}
        nearest_septic_or_sewer_m: {type: number, nullable: true}
        poor_groundwater_quality: {type: boolean}
        water_table_verified: {type: boolean}
    CapturePlan:
      type: object
      properties:
        decision: {type: string, enum: [STORE_REUSE, DETAIN_ONLY, SHALLOW_PIT_ROOF_ONLY, PIT_TRENCH_SHAFT, PIT_PLUS_RECHARGE_BORE, TANK_OR_BORE, NEEDS_DATA]}
        rule_id: {type: string}
        reason: {type: string}
        source: {type: string}
        banner: {type: string, description: "Experimental banner. Must be shown."}
        capture: {type: object, properties: {design_storm_mm: {type: number}, storm_volume_m3: {type: number}, annual_roof_capture_m3: {type: number}}}
        structure: {type: object, nullable: true}
        checks: {type: array, items: {type: object}}
        warnings: {type: array, items: {type: string}}
        maintenance: {type: array, items: {type: string}}
        first_flush: {type: string}
        inputs: {type: object}
    AlertResult: {type: object, properties: {sent: {type: integer}, recipients_n: {type: integer}, skipped_reason: {type: string, nullable: true}, text: {type: string}, kind: {type: string}, ledger_id: {type: integer, nullable: true}}}
